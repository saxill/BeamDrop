<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Transparent background: no rect behind any of this, so the icon
       takes the shape of the mushroom in the dock and the menu. -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0433a"/>
      <stop offset="1" stop-color="#c9201d"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf3d8"/>
      <stop offset="1" stop-color="#e8d5a8"/>
    </linearGradient>
  </defs>

  <!-- stem -->
  <path d="M20 40 h24 v9 a12 12 0 0 1 -24 0 z" fill="url(#stem)"/>
  <!-- eyes -->
  <ellipse cx="27" cy="47" rx="2.4" ry="4.2" fill="#3b2a1e"/>
  <ellipse cx="37" cy="47" rx="2.4" ry="4.2" fill="#3b2a1e"/>

  <!-- cap -->
  <path d="M32 6 C17 6 5 18 5 31 c0 6 4 10 10 10 h34 c6 0 10 -4 10 -10 C59 18 47 6 32 6 z"
        fill="url(#cap)"/>
  <!-- spots -->
  <circle cx="32" cy="21" r="9" fill="#fff"/>
  <circle cx="12.5" cy="30" r="5.5" fill="#fff"/>
  <circle cx="51.5" cy="30" r="5.5" fill="#fff"/>
</svg>
